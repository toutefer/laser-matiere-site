<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie Vidéos - Laser & Matières</title>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZCMRPQ514V"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-ZCMRPQ514V');
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #121212;
            color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .text-gold { color: #f59e0b; }
        .bg-gold { background-color: #f59e0b; }
        .hover-gold:hover { background-color: #d97706; }
        
        .laser-glow { border: 1px solid #374151; transition: all 0.3s ease; }
        .laser-glow:hover { border-color: #f59e0b; box-shadow: 0 0 25px rgba(245, 158, 11, 0.4), inset 0 0 10px rgba(245, 158, 11, 0.1); transform: translateY(-5px); }
    </style>
</head>
<body class="antialiased flex flex-col min-h-screen">

    <nav class="p-6 flex justify-between items-center border-b border-gray-800 bg-[#121212] sticky top-0 z-50">
        <a href="index.html" class="text-2xl md:text-3xl font-bold text-gold tracking-wider hover:text-white transition">LASER & MATIÈRES</a>
        <div class="hidden md:flex space-x-6 text-sm uppercase font-semibold tracking-widest">
            <a href="index.html#accueil" class="hover:text-gold transition duration-300">Accueil</a>
            <a href="index.html#expertises" class="hover:text-gold transition duration-300">Expertises</a>
            <a href="index.html#realisations" class="text-gold transition duration-300">Réalisations</a>
            <a href="index.html#tarifs" class="hover:text-gold transition duration-300">Tarifs</a>
            <a href="index.html#contact" class="hover:text-gold transition duration-300">Contact</a>
        </div>
    </nav>

    <section class="py-12 px-4 max-w-6xl mx-auto flex-grow flex flex-col items-center w-full">
        <h1 class="text-3xl md:text-4xl font-bold text-white uppercase tracking-widest mb-10 text-center">🎥 Galerie <span class="text-gold">Vidéos</span></h1>
        
        <!-- Vidéo Principale -->
        <div class="w-full bg-gray-800 p-4 rounded-2xl laser-glow shadow-xl mb-12">
            <video id="mainPlayer" controls class="w-full h-auto rounded-lg border border-gray-700 shadow-md max-h-[60vh] bg-black">
                <source src="video1.mp4" type="video/mp4">
                Votre navigateur ne supporte pas la lecture de vidéos.
            </video>
            <p id="mainTitle" class="text-2xl font-bold text-white text-center mt-6 mb-2">Réalisation 1</p>
        </div>

        <!-- Miniatures cliquables (4 vidéos) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 w-full">
            <div class="bg-gray-900 p-3 rounded-xl border border-gray-700 hover:border-gold transition duration-300 cursor-pointer shadow-lg hover:-translate-y-2" onclick="changeVideo('video1.mp4', 'Réalisation 1')">
                <video muted class="w-full h-28 object-cover rounded-lg pointer-events-none">
                    <source src="video1.mp4" type="video/mp4">
                </video>
                <p class="text-gray-300 text-center text-sm font-semibold mt-3">Vidéo 1</p>
            </div>

            <div class="bg-gray-900 p-3 rounded-xl border border-gray-700 hover:border-gold transition duration-300 cursor-pointer shadow-lg hover:-translate-y-2" onclick="changeVideo('video2.mp4', 'Réalisation 2')">
                <video muted class="w-full h-28 object-cover rounded-lg pointer-events-none">
                    <source src="video2.mp4" type="video/mp4">
                </video>
                <p class="text-gray-300 text-center text-sm font-semibold mt-3">Vidéo 2</p>
            </div>

            <div class="bg-gray-900 p-3 rounded-xl border border-gray-700 hover:border-gold transition duration-300 cursor-pointer shadow-lg hover:-translate-y-2" onclick="changeVideo('video3.mp4', 'Réalisation 3')">
                <video muted class="w-full h-28 object-cover rounded-lg pointer-events-none">
                    <source src="video3.mp4" type="video/mp4">
                </video>
                <p class="text-gray-300 text-center text-sm font-semibold mt-3">Vidéo 3</p>
            </div>

            <div class="bg-gray-900 p-3 rounded-xl border border-gray-700 hover:border-gold transition duration-300 cursor-pointer shadow-lg hover:-translate-y-2" onclick="changeVideo('video4.mp4', 'Réalisation 4')">
                <video muted class="w-full h-28 object-cover rounded-lg pointer-events-none">
                    <source src="video4.mp4" type="video/mp4">
                </video>
                <p class="text-gray-300 text-center text-sm font-semibold mt-3">Vidéo 4</p>
            </div>
        </div>

        <div class="mt-16 text-center">
            <a href="index.html" class="inline-block bg-gray-900 border border-gray-700 hover:border-gold text-white font-bold py-4 px-10 rounded-full hover-gold transition duration-300 shadow-lg">
                ← Retour à l'accueil
            </a>
        </div>
    </section>

    <script>
        function changeVideo(src, title) {
            const main = document.getElementById('mainPlayer');
            main.pause();
            main.querySelector('source').src = src;
            main.load();
            main.play();
            document.getElementById('mainTitle').textContent = title;
        }
    </script>

    <footer class="bg-black py-8 border-t border-gray-800 mt-auto w-full">
        <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="text-center md:text-left">
                <p class="text-gray-500 text-sm">© 2026 Laser & Matières by Toutefer. Tous droits réservés.</p>
                <p class="text-gray-600 text-xs mt-1">SIRET : 99294362790001</p>
            </div>
            <div>
                <a href="https://www.snapchat.com/add/lasermatiere" target="_blank" class="text-gold hover:text-white font-bold text-sm transition">👻 Snapchat : lasermatiere</a>
            </div>
        </div>
    </footer>

</body>
</html>
